name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  # Segunda 05:00 UTC: roda a CI mesmo sem push. Como os jobs resolvem as
  # dependências com `composer update`, o agendamento testa automaticamente
  # contra a versão mais nova do flarum/core e detecta quebras trazidas por
  # novas versões do Flarum antes que cheguem a você.
  schedule:
    - cron: '0 5 * * 1'

# §35.13 C1 — default-deny do GITHUB_TOKEN. Cada job declara o que precisa.
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Valida o composer.json as-committed, fora da matriz que muta o arquivo.
  composer-validate:
    name: composer validate (--strict)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - name: Validar composer.json
        run: composer validate --strict --no-check-publish --no-check-version

  # A cada run o composer update resolve o flarum/core mais novo da célula
  # (estável/rc e 2.x-dev), então uma quebra de versão nova do Flarum — ou da
  # dependência fof/user-bio — aparece aqui, inclusive no agendamento semanal.
  php:
    name: PHP ${{ matrix.php }} × flarum/core ${{ matrix.flarum-core }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        flarum-core:
          - '^2.0.0@rc'
          - '2.x-dev'
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Pinar flarum/core na célula da matriz
        run: composer require --no-update "flarum/core:${{ matrix.flarum-core }}"
      - name: Resolver dependências (composer update)
        run: composer update --no-interaction --no-progress --prefer-stable --no-scripts --ignore-platform-req=php+
      - name: Lint PHP (php -l)
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find extend.php src -name '*.php' -print0 2>/dev/null)
          [ "${#files[@]}" -gt 0 ] || { echo "Nenhum arquivo PHP encontrado"; exit 1; }
          printf '%s\0' "${files[@]}" | xargs -0 -n1 -P4 php -l
      - name: composer audit
        run: composer audit --format=plain
        continue-on-error: true

  js:
    name: JS (build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: js/package-lock.json
      - name: Instalar dependências JS
        working-directory: js
        run: npm ci
      - name: Build (webpack production)
        working-directory: js
        run: npm run build
      - name: npm audit
        working-directory: js
        run: npm audit --audit-level=high
        continue-on-error: true
